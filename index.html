<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><title>舊金山家庭行程手冊</title><link rel="apple-touch-icon" href="app-icon.png"><link rel="icon" type="image/png" href="app-icon.png"><meta name="apple-mobile-web-app-title" content="舊金山行程"><meta name="theme-color" content="#F2A497"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style><style id="page-style">
/* ============ 日系繪本風 旅行手冊 — design tokens ============ */
/* layout: 手冊式單欄版面，頂端固定分頁籤，卡片以粗墨線＋大圓角呈現，平塗色塊不用漸層 */
:root{
  --paper:#FFFCF6;
  --paper-2:#FFF8EC;
  --ink:#3E3A39;
  --ink-soft:#6b6563;
  --coral:#F2A497;
  --coral-deep:#e8816f;
  --yamabuki:#F6D27A;
  --yamabuki-deep:#e6b746;
  --mizu:#A8D3E6;
  --mizu-deep:#79b6d1;
  --wakatake:#B9DAA5;
  --wakatake-deep:#8fc072;
  --sky:#E4F2F8;
  --dusk:#FBE3D6;
  --granite:#EEE7DA;
  --granite-2:#D9CDB8;
  --bark:#C98A6B;
  --bark-deep:#9E6449;
  --pine-deep:#6A9F57;
  --emerald:#86CDBB;
  --sand:#F1E2BF;
  --line:3px solid var(--ink);
  --line-thin:2px solid var(--ink);
  --r-lg:28px;
  --r-md:18px;
  --r-sm:12px;
  --font-ui:'Huninn','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);line-height:1.6;font-size:17px;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--font-ui);text-wrap:balance;margin:0}
p{margin:0}
button,input,select,textarea{font-family:var(--font-ui)}
a{color:var(--coral-deep)}
.icon{width:1.1em;height:1.1em;display:inline-block;vertical-align:-0.18em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon.filled{fill:currentColor;stroke:none}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ---------- app shell ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--coral)}
#topnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--coral);border-bottom:var(--line);
  padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px))}
#topnav .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;color:var(--ink);margin-bottom:8px}
#topnav .brand svg{width:22px;height:22px}
#tabwrap{position:relative}
#tabbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;scroll-behavior:smooth}
#tabbar::-webkit-scrollbar{display:none}
.tabbtn{flex:1 0 64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:7px 4px 6px;border-radius:16px;border:var(--line-thin);
  background:var(--paper);color:var(--ink);font-size:15px;font-weight:700;cursor:pointer;transition:transform .15s ease;white-space:nowrap}
.tabbtn[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tabbtn:active{transform:scale(.95)}
.tabbtn .icon{width:21px;height:21px}
#tabwrap .tabmore{position:absolute;top:0;right:0;bottom:2px;width:46px;display:none;align-items:center;justify-content:flex-end;border:none;padding:0 2px 0 0;cursor:pointer;
  background:linear-gradient(90deg,rgba(242,164,151,0),var(--coral) 55%);color:var(--ink)}
#tabwrap .tabmore .icon{width:22px;height:22px;transform:rotate(-90deg)}
#tabwrap.more .tabmore{display:flex}
.subback{display:inline-flex;align-items:center;gap:6px;margin:0 0 12px;border:var(--line-thin);border-radius:999px;background:var(--paper);color:var(--ink);font-weight:700;font-size:16px;padding:8px 16px;cursor:pointer;font-family:var(--font-ui)}
.subback .icon{transform:rotate(90deg)}
.itin-top{display:flex;justify-content:flex-end;margin:-8px 0 6px}
.prep-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prep-btn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;border:var(--line);border-radius:var(--r-md);background:var(--paper);color:var(--ink);padding:14px;cursor:pointer;text-align:left;font-family:var(--font-ui)}
.prep-btn .icon{width:26px;height:26px}
.prep-btn b{font-size:18px}
.prep-btn span{font-size:14px;color:var(--ink-soft)}
.prep-btn.todo{background:var(--yamabuki)}

main{flex:1;padding:18px max(16px,env(safe-area-inset-left,0px)) 110px max(16px,env(safe-area-inset-right,0px));max-width:640px;margin:0 auto;width:100%}
.tabpanel{animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- cards & components ---------- */
.card{background:var(--paper);border:var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:14px}
.card.flat{box-shadow:none}
.section-title{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:700;margin:4px 0 12px}
.section-title svg{width:20px;height:20px}
.muted{color:var(--ink-soft);font-size:16px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;border:var(--line-thin);
  font-size:15px;font-weight:700;white-space:nowrap}
.chip.tag-flight{background:var(--coral)}
.chip.tag-drive{background:var(--mizu)}
.chip.tag-walk{background:var(--wakatake)}
.chip.tag-uber{background:var(--yamabuki)}
.chip.tag-pickup{background:var(--coral)}
.chip.tag-cablecar{background:var(--yamabuki)}
.chip.tag-bus{background:var(--mizu)}
.chip.tag-bart{background:var(--mizu)}
.chip.tag-shuttle{background:var(--wakatake)}
.btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;border:var(--line-thin);border-radius:999px;
  background:var(--paper);color:var(--ink);font-weight:700;font-size:16px;padding:9px 16px;cursor:pointer;transition:transform .12s ease}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--coral);border-color:var(--ink)}
.btn.good{background:var(--wakatake)}
.btn.warn{background:var(--yamabuki)}
.btn.ghost{background:transparent;border-style:dashed}
.btn.sm{padding:5px 10px;font-size:15px}
.btn.icon-only{padding:7px;border-radius:50%}
.btn[disabled]{opacity:.45;pointer-events:none}
input[type=text],input[type=number],input[type=date],select,textarea{
  border:var(--line-thin);border-radius:var(--r-sm);background:var(--paper);color:var(--ink);padding:9px 12px;font-size:16.5px;width:100%}
textarea{resize:vertical;min-height:60px}
label.field{display:flex;flex-direction:column;gap:4px;font-size:15px;color:var(--ink-soft);font-weight:700;margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{min-width:0}
.hr{border:none;border-top:2px dashed var(--ink);opacity:.35;margin:14px 0}
.badge-star{display:inline-flex;align-items:center;gap:3px;color:var(--coral-deep);font-weight:700;font-size:15px}
.empty-state{text-align:center;padding:36px 18px;color:var(--ink-soft)}
.empty-state svg{width:56px;height:56px;margin-bottom:10px;opacity:.7}

/* ---------- home ---------- */
.hero{background:var(--paper-2);border:var(--line);border-radius:var(--r-lg);padding:20px;margin-bottom:16px;position:relative;overflow:hidden}
.hero-pic{border:var(--line-thin);border-radius:var(--r-md);overflow:hidden;margin-bottom:14px;background:var(--sky)}
.hero h1{font-size:24px;margin-bottom:2px}
.hero .sub{font-size:16px;color:var(--ink-soft);margin-bottom:12px}
.countdown{display:inline-flex;align-items:baseline;gap:6px;background:var(--paper);border:var(--line-thin);border-radius:999px;padding:8px 16px}
.countdown b{font-size:28px;font-family:var(--font-ui)}
.flight-card{border:var(--line-thin);border-radius:var(--r-md);padding:12px;margin-bottom:10px;background:var(--paper-2)}
.flight-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.flight-row .pt{text-align:center}
.flight-row .pt b{display:block;font-size:22px}
.flight-row .pt span{display:block;font-size:14px;color:var(--ink-soft)}
.flight-arrow{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);gap:4px;font-size:14px;flex-direction:column}
.flight-arrow .line{width:100%;border-top:2px dashed var(--ink);position:relative}
.lodge-row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed rgba(62,58,57,.25)}
.lodge-row:last-child{border-bottom:none}
.lodge-dates{flex:0 0 auto;text-align:center;background:var(--yamabuki);border:var(--line-thin);border-radius:var(--r-sm);padding:6px 9px;font-size:15px;font-weight:700;min-width:64px}

/* ---------- itinerary ---------- */
.day-illust-wrap{position:relative;border:var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:12px;background:var(--sky);animation:dayBounce .5s cubic-bezier(.34,1.56,.64,1) 1}
.day-illust-label{display:flex;align-items:center;gap:6px;border-top:var(--line-thin);background:var(--paper);padding:7px 14px;font-size:16px;font-weight:700}
.day-illust-label .icon{width:15px;height:15px;color:var(--coral-deep)}
@keyframes dayBounce{0%{transform:scale(.88) translateY(16px);opacity:0}55%{transform:scale(1.035) translateY(-5px);opacity:1}78%{transform:scale(.995) translateY(1px)}100%{transform:none;opacity:1}}
/* ---------- picture-book illustrations: local, gentle motion ---------- */
.ill{width:100%;height:auto;display:block}
.ill .an{transform-box:fill-box;transform-origin:50% 50%}
.ill .drift{animation:ilDrift 16s ease-in-out infinite alternate}
.ill .drift.rev{animation-duration:21s;animation-direction:alternate-reverse}
@keyframes ilDrift{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
.ill .bob{animation:ilBob 2.8s ease-in-out infinite}
@keyframes ilBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
.ill .flow{stroke-dasharray:5 7;animation:ilFlow .9s linear infinite}
@keyframes ilFlow{to{stroke-dashoffset:-12}}
.ill .twinkle{animation:ilTwinkle 2.6s ease-in-out infinite}
@keyframes ilTwinkle{0%,100%{opacity:1}50%{opacity:.25}}
.ill .shimmer{animation:ilShimmer 3.2s ease-in-out infinite}
@keyframes ilShimmer{0%,100%{transform:translateX(0);opacity:.9}50%{transform:translateX(5px);opacity:.35}}
.ill .sway{transform-origin:50% 100%;animation:ilSway 4.6s ease-in-out infinite}
@keyframes ilSway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.ill .drive{animation:ilDrive 7.5s linear infinite}
@keyframes ilDrive{0%{transform:translateX(-24px);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(24px);opacity:0}}
.ill .climb{animation:ilClimb 7s ease-in-out infinite}
@keyframes ilClimb{0%{transform:translateX(-16px);opacity:0}14%{opacity:1}86%{opacity:1}100%{transform:translateX(16px);opacity:0}}
.ill .glide{animation:ilGlide 6s ease-in-out infinite}
@keyframes ilGlide{0%,100%{transform:translate(0,0)}50%{transform:translate(6px,-4px)}}
.ill .land{animation:ilLand 8s ease-out infinite}
@keyframes ilLand{0%{transform:translate(-20px,-10px);opacity:0}14%{opacity:1}86%{opacity:1}100%{transform:translate(20px,10px);opacity:0}}
.ill .takeoff{animation:ilTakeoff 8s ease-in infinite}
@keyframes ilTakeoff{0%{transform:translate(-20px,10px);opacity:0}14%{opacity:1}86%{opacity:1}100%{transform:translate(22px,-12px);opacity:0}}
.ill .fall{animation:ilFall 5s linear infinite}
@keyframes ilFall{0%{transform:translate(0,-12px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(-10px,44px);opacity:0}}
.ill .flap{animation:ilFlap .9s ease-in-out infinite}
@keyframes ilFlap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45)}}
.ill .spin{animation:ilSpin 36s linear infinite}
@keyframes ilSpin{to{transform:rotate(360deg)}}
.ill .tail{transform-origin:100% 100%;animation:ilTail 1.9s ease-in-out infinite}
@keyframes ilTail{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}
.ill .fog{animation:ilFog 12s ease-in-out infinite alternate}
@keyframes ilFog{from{transform:translateX(-16px)}to{transform:translateX(18px)}}
.ill .beam{animation:ilBeam 5s ease-in-out infinite}
@keyframes ilBeam{0%,100%{opacity:.18}50%{opacity:.42}}
#daypills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;position:sticky;top:calc(var(--navh,96px) + env(safe-area-inset-top,0px));z-index:15;background:var(--paper);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 12px;padding:12px max(16px,env(safe-area-inset-left,0px)) 10px;border-bottom:1px dashed rgba(62,58,57,.3)}
.daynav{display:flex;gap:10px;margin:18px 0 6px}
.daynav button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;border:var(--line);border-radius:var(--r-md);background:var(--paper);color:var(--ink);padding:12px 8px;cursor:pointer;font-family:var(--font-ui);transition:transform .12s ease}
.daynav button:active{transform:scale(.97)}
.daynav button.next{background:var(--wakatake)}
.daynav b{font-size:18px}
.daynav span{font-size:14px;color:var(--ink-soft)}
.daynav .spacer{flex:1 1 0}
#daypills::-webkit-scrollbar{display:none}
.daypill{flex:0 0 auto;border:var(--line-thin);border-radius:var(--r-md);background:var(--paper);padding:8px 14px;text-align:center;cursor:pointer}
.daypill b{display:block;font-size:17px}
.daypill span{font-size:14px;color:var(--ink-soft)}
.daypill[aria-selected="true"]{background:var(--wakatake);transform:translateY(-2px)}
/* compact mode while scrolling down: thin icon-only tab bar + one-line date chips */
body.compact #topnav{padding-top:6px;padding-bottom:6px}
body.compact #topnav .brand{display:none}
body.compact .tabbtn{flex-direction:row;padding:6px 4px;gap:0;border-radius:12px}
body.compact .tabbtn span{display:none}
body.compact .tabbtn .icon{width:20px;height:20px}
body.compact #daypills{padding-top:7px;padding-bottom:7px;gap:6px}
body.compact .daypill{padding:4px 10px;border-radius:999px;display:flex;align-items:baseline;gap:4px}
body.compact .daypill b{display:inline;font-size:15px}
body.compact .daypill span{font-size:13px}
body.compact .daypill[aria-selected="true"]{transform:none}
/* meals */
.meals{padding:14px 14px 6px}
.meal-row{display:flex;gap:10px;padding:10px 0;border-top:1px dashed rgba(62,58,57,.25)}
.meal-row:first-of-type{border-top:none;padding-top:4px}
.meal-tag{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:var(--line-thin);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;background:var(--paper-2)}
.meal-tag.m1{background:#FDF3D2}.meal-tag.m2{background:#E3F0F2}.meal-tag.m3{background:#F9E1DB}
.meal-body{flex:1;min-width:0}
.meal-name{font-weight:700;font-size:17px;line-height:1.4}
.meal-dish{font-size:15.5px;margin-top:5px;line-height:1.55}
.meal-dish b{display:inline-block;font-size:13px;background:var(--wakatake);border:1.5px solid var(--ink);border-radius:999px;padding:0 8px;margin-right:6px}
.meal-price{font-size:15px;font-weight:700;color:#9a5a2c;margin-top:3px}
.meal-note{font-size:15px;color:var(--ink-soft);margin-top:2px;line-height:1.55}
.mtags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.mtag{font-size:13px;font-weight:700;border-radius:999px;padding:2px 9px;border:1.5px solid var(--ink);background:var(--paper)}
.mtag.must{background:#C9533F;color:#fff;border-color:#C9533F}
.mtag.res{background:#F6D27A}
.mtag.wait{background:#FBE3B4}
.mtag.cash{background:#E3F0F2}
.mtag.nores{background:var(--paper-2)}
.meal-alts{white-space:normal;color:var(--ink);display:none;margin-top:8px;background:var(--paper-2);border-radius:var(--r-sm);padding:4px 10px;border:1px dashed rgba(62,58,57,.3)}
.meal-alts.open{display:block}
.meal-alt{padding:8px 0;border-top:1px dashed rgba(62,58,57,.2)}
.meal-alt:first-child{border-top:none}
.meal-alt .meal-name{font-size:16px}
.meal-body .mapbtn{margin-top:7px}
.timeline{position:relative;padding-left:20px}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:repeating-linear-gradient(var(--ink),var(--ink) 5px,transparent 5px,transparent 10px)}
.leg{position:relative;margin-bottom:16px;animation:popin .3s ease}
@keyframes popin{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.leg::before{content:"";position:absolute;left:-20px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--ink)}
.leg.hl::before{background:var(--coral-deep);width:14px;height:14px;left:-21px}
.leg-card{border:var(--line-thin);border-radius:var(--r-md);padding:12px 14px;background:var(--paper)}
.leg-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.leg-time{font-weight:700;font-size:16.5px;font-variant-numeric:tabular-nums}
.leg-title{font-weight:700;font-size:17px;margin:2px 0}
.leg-place{font-size:15px;color:var(--ink-soft)}
.leg-note{font-size:15px;color:var(--ink-soft);margin-top:4px;white-space:pre-wrap}
.leg-detail-toggle{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:15px;font-weight:700;color:var(--coral-deep);cursor:pointer;background:var(--paper-2);border:1px dashed rgba(62,58,57,.35);border-radius:999px;padding:5px 11px}
.leg-detail-toggle .icon{width:13px;height:13px;transition:transform .2s ease}
.leg-detail-toggle[aria-expanded="true"] .icon{transform:rotate(180deg)}
.leg-detail{display:none;font-size:15px;color:var(--ink-soft);margin-top:6px;white-space:pre-wrap;background:var(--paper-2);border-radius:var(--r-sm);padding:8px 10px;border:1px dashed rgba(62,58,57,.3)}
.leg-detail.open{display:block}
@media (prefers-reduced-motion:reduce){.leg-detail-toggle .icon{transition:none}}
.leg-admin-row{display:flex;gap:6px;margin-top:8px}
.leg-drag{cursor:grab;touch-action:none;color:var(--ink-soft);padding:4px}
.leg.dragging{opacity:.5}
.leg.dropline::after{content:"";position:absolute;left:-4px;right:0;height:3px;background:var(--coral-deep);border-radius:2px;top:-8px}

/* ---------- point-to-point transit hops ---------- */
.hop{position:relative;margin:-6px 0 10px;padding:4px 0 4px 2px;font-size:15px;color:var(--ink-soft)}
.hop::before{content:"";position:absolute;left:-19px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}
.hop-main{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hop-main b{color:var(--ink);font-size:16.5px;font-variant-numeric:tabular-nums}
.hop-eta{display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.hop-eta .icon{width:13px;height:13px}
.hop-sub{margin-top:2px;line-height:1.5}
.hop-warn{display:flex;gap:6px;align-items:flex-start;margin-top:5px;background:var(--yamabuki);border:var(--line-thin);border-radius:var(--r-sm);padding:6px 9px;color:var(--ink);font-weight:700;font-size:15px}
.hop-warn .icon{flex:0 0 auto;width:15px;height:15px;margin-top:1px}
.maplinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.mapbtn{display:inline-flex;align-items:center;gap:4px;border:var(--line-thin);border-radius:999px;padding:4px 11px;font-size:15px;font-weight:700;
  color:var(--ink);background:var(--paper-2);text-decoration:none;line-height:1.4}
.mapbtn .icon{width:14px;height:14px;color:var(--coral-deep)}
.mapbtn.nav{background:var(--mizu)}
.mapbtn.nav .icon{color:var(--ink)}
.hop .mapbtn{margin-top:6px}
.hop-park{display:flex;gap:9px;align-items:flex-start;margin-top:8px;background:#EAF3F7;border:var(--line-thin);border-radius:var(--r-sm);padding:9px 11px;color:var(--ink)}
.hop-park .pbadge{flex:0 0 auto;width:26px;height:26px;border-radius:7px;background:#3B6FB6;color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;font-family:var(--font-ui);margin-top:1px}
.hop-park b{display:block;font-size:16px}
.hop-park .pk-fee{display:block;font-size:15px;color:var(--ink-soft)}

/* ---------- tiny utils ---------- */
function $(sel, root){ return (root||document).querySelector(sel); }
function $all(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function esc(s){ var d=document.createElement('div'); d.appendChild(document.createTextNode(s==null?'':String(s))); return d.innerHTML; }
function uid(prefix){ return (prefix||'id')+'_'+Math.random().toString(36).slice(2,9); }
function lsGet(k, fallback){ try{ var v = localStorage.getItem(LS+k); return v===null?fallback:JSON.parse(v); }catch(e){ return fallback; } }
function lsSet(k, v){ try{ localStorage.setItem(LS+k, JSON.stringify(v)); }catch(e){} }
function icon(name, cls){ return '<svg class="icon '+(cls||'')+'" viewBox="0 0 24 24"><use href="#i-'+name+'"/></svg>'; }
function fmtTWD(n){ n = Math.round(n||0); return n.toLocaleString('zh-Hant-TW'); }

/* ---------- toast ---------- */
var toastTimer=null;
function toast(msg){
  var old = $('.toast'); if(old) old.remove();
  var t = document.createElement('div'); t.className='toast'; t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.remove(); }, 2200);
}

/* ---------- modal helper ---------- */
function openModal(title, bodyHtml, onMount){
  var root = $('#modal-root');
  root.innerHTML = '<div class="modal-backdrop"><div class="modal-sheet">'+
    '<div class="modal-head"><h3>'+esc(title)+'</h3><button class="btn icon-only" data-close>'+icon('close')+'</button></div>'+
    '<div class="modal-body">'+bodyHtml+'</div></div></div>';
  root.querySelector('.modal-backdrop').addEventListener('click', function(e){ if(e.target===this) closeModal(); });
  root.querySelector('[data-close]').addEventListener('click', closeModal);
  if(onMount) onMount(root);
}
function closeModal(){ $('#modal-root').innerHTML=''; }

/* ---------- dirty / publish ---------- */
function markDirty(){ dirty = true; renderAdminBar(); }
function clearDirty(){ dirty = false; renderAdminBar(); }
window.addEventListener('beforeunload', function(e){ if(dirty){ e.preventDefault(); e.returnValue=''; } });

function renderAdminBar(){
  var bar = $('#adminbar');
  var fab = $('#adminfab');
  fab.classList.toggle('on', isAdmin);
  fab.innerHTML = icon(isAdmin?'unlock':'lock');

  }
}

/* ============ HOSTING: Claude artifact vs GitHub Pages ============
   HOST is fixed at build time. On GitHub Pages there is no password in the
   page: editing unlocks only on a device that holds a GitHub token with write
   access to this repository, and "發布" commits index.html through the GitHub API. */
var LOADED_REV = (STATE.meta && STATE.meta.rev) || '';
function ghRepo(){
  var c = lsGet('gh', null) || {};
  var owner = c.owner, repo = c.repo;
  if(!owner && /\.github\.io$/i.test(location.hostname)){
    owner = location.hostname.split('.')[0];
    repo = location.pathname.split('/').filter(Boolean)[0] || (owner + '.github.io');
  }
  return {owner: owner, repo: repo, branch: c.branch || '', token: c.token || ''};
}
function ghApi(path, opts){
  var c = ghRepo(); opts = opts || {};
  var h = {'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'};
  if(c.token) h['Authorization'] = 'Bearer ' + c.token;
  if(opts.body) h['Content-Type'] = 'application/json';
  opts.headers = h;
  return fetch('https://api.github.com/repos/' + encodeURIComponent(c.owner) + '/' + encodeURIComponent(c.repo) + path, opts).then(function(r){
    if(!r.ok){ var e = new Error('github ' + r.status); e.status = r.status; throw e; }
    return r.status === 204 ? null : r.json();
  });
}
function b64FromBytes(u8){
  var s = ''; for(var i = 0; i < u8.length; i += 0x8000){ s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); }
  return btoa(s);
}
function b64Utf8(str){ return b64FromBytes(new TextEncoder().encode(str)); }
function utf8FromB64(b64){
  var bin = atob(String(b64).replace(/\s/g, '')), u8 = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(u8);
}
function stateFromHtml(html){
  var m = html.match(/<script id="state-data" type="application\/json">([\s\S]*?)<\/script>/);
  if(!m) return null;
  try{ return JSON.parse(m[1].replace(/<\\\/script/gi, '</script')); }catch(e){ return null; }
}
function ghBranch(){
  var c = ghRepo();
  if(c.branch) return Promise.resolve(c.branch);
  return ghApi('').then(function(r){ var cfg = lsGet('gh', {}) || {}; cfg.branch = r.default_branch || 'main'; lsSet('gh', cfg); return cfg.branch; });
}
/* admin opened the page: pull the newest saved version straight from GitHub (the Pages CDN can lag 1–10 min) */
function ghSyncLatest(){
  if(HOST !== 'github' || !isAdmin || !ghRepo().token) return Promise.resolve();
  return ghBranch().then(function(br){ return ghApi('/contents/index.html?ref=' + encodeURIComponent(br)); }).then(function(f){
    var st = stateFromHtml(utf8FromB64(f.content || ''));
    if(st && st.meta && st.meta.rev && st.meta.rev !== LOADED_REV && !dirty){
      STATE = st; LOADED_REV = st.meta.rev; renderAll(); toast('已載入最新發布的內容');
    }
  }).catch(function(){});
}
function ghPublish(){
  var c = ghRepo();
  if(!c.token){ toast('這台裝置還沒設定 GitHub 金鑰'); return; }
  toast('發布中…');
  var newRev = uid('rev'), oldRev = STATE.meta.rev, branch;
  ghBranch().then(function(br){ branch = br; return ghApi('/contents/index.html?ref=' + encodeURIComponent(br)); }).then(function(f){
    var remote = stateFromHtml(utf8FromB64(f.content || ''));
    var remoteRev = remote && remote.meta ? remote.meta.rev : '';
    if(remoteRev && LOADED_REV && remoteRev !== LOADED_REV){ var e = new Error('conflict'); e.code = 'conflict'; throw e; }
    STATE.meta.rev = newRev;
    var doc = buildFullDocument();
    return ghApi('/contents/index.html', {method:'PUT', body: JSON.stringify({
      message: '更新行程 ' + new Date().toISOString().slice(0, 16), content: b64Utf8(doc), sha: f.sha, branch: branch })});
  }).then(function(){
    LOADED_REV = newRev; clearDirty();
    toast('已發布！約 1–10 分鐘後旅伴重新整理就會看到');
  }).catch(function(err){
    STATE.meta.rev = oldRev;
    if(err && err.code === 'conflict') toast('網站上有更新的版本（可能是另一台裝置發布的），請重新整理後再修改');
    else if(err && (err.status === 401 || err.status === 403)) toast('發布失敗：GitHub 金鑰無效或已過期，請到鎖頭重新設定');
    else toast('發布失敗，請稍後再試');
  });
}
/* uploads (traffic maps): Claude artifact asset store, or a file committed to the repo */
var localPreview = {};
function uploadFile(file){
  if(HOST === 'github'){
    var c = ghRepo(); if(!c.token) return Promise.reject(new Error('no token'));
    var ext = ((file.name || '').match(/\.([a-z0-9]{1,5})$/i) || [, 'jpg'])[1].toLowerCase();
    var path = 'uploads/' + uid('img') + '.' + ext;
    return Promise.all([ghBranch(), file.arrayBuffer()]).then(function(r){
      return ghApi('/contents/' + path, {method:'PUT', body: JSON.stringify({message:'上傳 ' + path, content: b64FromBytes(new Uint8Array(r[1])), branch: r[0]})});
    }).then(function(){ localPreview[path] = URL.createObjectURL(file); return {id: path, url: path, contentType: file.type}; });
  }
  if(!assetsCap) return Promise.reject(new Error('no assets'));
  return assetsCap.upload(file);
}
function deleteFile(id){
  if(!id) return;
  if(HOST === 'github'){
    ghBranch().then(function(br){
      return ghApi('/contents/' + id + '?ref=' + encodeURIComponent(br)).then(function(f){
        return ghApi('/contents/' + id, {method:'DELETE', body: JSON.stringify({message:'刪除 ' + id, sha: f.sha, branch: br})});
      });
    }).catch(function(){});
    return;
  }
  if(assetsCap){ try{ assetsCap.delete(id); }catch(e){} }
}
function canUpload(){ return HOST === 'github' ? !!ghRepo().token : !!assetsCap; }
function imgSrc(m){ return localPreview[m.url] || m.url; }

function openTicketEditor(i){
  var list = STATE.tickets, isNew = i<0;
  var t = isNew ? {id:uid('tk'), title:'', when:'', day:'', status:'todo', cost:'', where:'', url:'', who:'', note:'', conf:'', files:[]} : list[i];
  var stOpts = ['todo','booked','onsite'].map(function(k){ return '<option value="'+k+'"'+(k===t.status?' selected':'')+'>'+TK_ST[k]+'</option>'; }).join('');
  var dayOpts = '<option value="">（不連結）</option>'+STATE.itinerary.map(function(d){ return '<option'+(d.date===t.day?' selected':'')+'>'+esc(d.date)+'</option>'; }).join('');
  openModal(isNew?'新增票券／預訂':'編輯票券／預訂',
    '<label class="field">項目名稱<input type="text" id="kTitle" value="'+esc(t.title)+'"></label>'+

    '<div class="row"><label class="field" style="flex:1">日期說明<input type="text" id="kWhen" value="'+esc(t.when)+'"></label>'+
    '<label class="field" style="flex:1">連到哪天行程<select id="kDay">'+dayOpts+'</select></label></div>'+
    '<label class="field">費用<input type="text" id="kCost" value="'+esc(t.cost)+'"></label>'+
    '<label class="field">怎麼買<input type="text" id="kWhere" value="'+esc(t.where)+'"></label>'+
    '<label class="field">官方網站（選填）<input type="text" id="kUrl" value="'+esc(t.url)+'" placeholder="https://"></label>'+
    '<label class="field">雲端硬碟票券連結（選填，貼上檔案的共用連結）<input type="text" id="kDrive" value="'+esc(t.drive||'')+'" placeholder="https://drive.google.com/…"></label>'+
    '<label class="field">負責／要帶的人<input type="text" id="kWho" value="'+esc(t.who)+'"></label>'+
    '<label class="field">備註<textarea id="kNote">'+esc(t.note)+'</textarea></label>'+
    '<div class="row"><button class="btn primary" id="kSave">儲存</button></div>',
    function(root){
      root.querySelector('#kSave').addEventListener('click', function(){
        var g = function(id){ return root.querySelector(id).value.trim(); };
        if(!g('#kTitle')){ toast('請輸入項目名稱'); return; }
        var url = g('#kUrl'); if(url && !/^https?:\/\//i.test(url)) url = '';
        var drive = g('#kDrive'); if(drive && !/^https:\/\//i.test(drive)) drive = '';
        var o = {id:t.id, title:g('#kTitle'), status:root.querySelector('#kSt').value, conf:g('#kConf'), when:g('#kWhen'),
          day:root.querySelector('#kDay').value, cost:g('#kCost'), where:g('#kWhere'), url:url, drive:drive, who:g('#kWho'), note:g('#kNote'), files:t.files||[]};
        if(isNew) list.push(o); else list[i] = o;
        markDirty(); closeModal(); renderTickets();
      });
    });
}

function daysUntil(){
  var now = new Date();
  var target = new Date(STATE.meta.tripStartLocal);
  var ms = target - now;
  return Math.ceil(ms / 86400000);
}

function heroIllust(){

function wxIcon(code){
  if(code===0||code===1) return 'wx-sun';
  if(code===2) return 'wx-part';
  if(code===45||code===48) return 'wx-fog';
  if((code>=71&&code<=77)||code===85||code===86) return 'wx-snow';
  if((code>=51&&code<=67)||(code>=80&&code<=82)||code>=95) return 'wx-rain';
  return 'wx-cloud';
}
function wxText(code){
  var m = {0:'晴',1:'大致晴朗',2:'晴時多雲',3:'多雲',45:'霧',48:'霧',51:'毛毛雨',53:'毛毛雨',55:'毛毛雨',61:'小雨',63:'雨',65:'大雨',

  return m[code] || '多雲';
}
function weatherHtml(day){
  var W = STATE.weather; if(!W || !W.days || !W.days[day.date]) return '';
  var list = W.days[day.date], hasNormal = false, hasFc = false;
  var items = list.map(function(w){
    var isFc = w.kind==='forecast';
    if(isFc) hasFc = true; else hasNormal = true;
    return '<div class="wx-item">'+icon(isFc ? wxIcon(w.code) : 'calendar')+
      '<span class="nm">'+esc(w.name)+'・'+(isFc ? esc(w.text||wxText(w.code)) : '往年 11 月平均')+'</span>'+
      '<span class="tp">'+w.tmax+'° / '+w.tmin+'°</span>'+
      (isFc && w.pop!=null ? '<span class="pp">降雨 '+w.pop+'%</span>' : '')+'</div>'+
      (w.note ? '<div class="wx-foot" style="margin:-3px 0 0 30px">'+esc(w.note)+'</div>' : '');
  }).join('');
  var foot = [];
  if(hasFc) foot.push(esc(W.forecastSource)+' 預報（'+esc(W.updated)+' 更新）');
  if(hasNormal) foot.push('這天的預報還沒出來（約出發前 7 天才有），先列往年同期平均；出發前會再更新成正式預報');

}

/* layout A: while scrolling down, shrink the tab bar + date chips; scrolling up restores them */
var isCompact = false, compactGuard = 0, lastScrollY = 0, upAccum = 0;
function setCompact(on){
  if(on === isCompact) return;
  var vh = window.innerHeight, probeY = Math.min(vh-10, (document.getElementById('topnav').offsetHeight||100) + 140);
  var anchor = document.elementFromPoint(window.innerWidth/2, probeY);
  var before = anchor ? anchor.getBoundingClientRect().top : null;
  isCompact = on; document.body.classList.toggle('compact', on); syncNavHeight();
  if(anchor && before!=null){
    var after = anchor.getBoundingClientRect().top;
    compactGuard = Date.now() + 250;
    window.scrollBy(0, after - before);
  }
  lastScrollY = window.scrollY; upAccum = 0;
}
window.addEventListener('scroll', function(){
  var y = window.scrollY;
  if(Date.now() < compactGuard){ lastScrollY = y; return; }
  var dy = y - lastScrollY; lastScrollY = y;
  if(y < 60){ setCompact(false); return; }
  if(dy > 0){ upAccum = 0; if(y > 180) setCompact(true); }
  else if(dy < 0){ upAccum -= dy; if(upAccum > 60) setCompact(false); }
}, {passive:true});

/* ---- transit hop: how to get from the previous point to this leg ---- */
function hhmm(s, which){
  var m = String(s||'').match(/(\d{1,2}):(\d{2})/g);
  if(!m) return null;
  var t = (which==='end' && m.length>1) ? m[m.length-1] : m[0];
  var p = t.split(':'); return parseInt(p[0],10)*60 + parseInt(p[1],10);
}
function fmtHM(mins){ mins = ((mins % 1440) + 1440) % 1440; var h = Math.floor(mins/60), m = mins%60; return (h<10?'0':'')+h+':'+(m<10?'0':'')+m; }
function durMinutes(dur){
  /* longest plausible total in a free-text duration, e.g. 約 1 小時 15 分 / 5–8 分 / 步行 10 分＋BART 25 分 */
  var s = String(dur||''), total = 0, hit = false;
  function one(part){
    var h = part.match(/(\d+)\s*小時/), m = part.match(/(\d+)(?:\s*[–~-]\s*(\d+))?\s*分/);
    var v = 0;
    if(h){ v += parseInt(h[1],10)*60; hit = true; }
    if(m){ v += parseInt(m[2]||m[1],10); hit = true; }
    return v;
  }
  s.split(/[＋+]/).forEach(function(part){
    /* range with units on both sides, e.g. 約 40 分–1 小時 / 55 分–1 小時 40 分 → take the upper bound */
    var r = part.match(/^(.*?(?:分|小時))\s*[–~]\s*(.*\d.*?(?:分|小時).*)$/);
    if(r){ total += Math.max(one(r[1]), one(r[2])); }
    else { total += one(part); }
  });
  return hit ? total : null;
}
function gmapSearch(q){ return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q); }
var NAV_MODE = {drive:'driving', pickup:'driving', uber:'driving', walk:'walking', bus:'transit', bart:'transit', cablecar:'transit'};
function gmapNav(q, mode){ return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(q)+'&travelmode='+mode; }
function tagLabelOf(tag){ var o = TAG_OPTIONS.filter(function(x){return x[0]===tag;})[0]; return o ? o[1] : ''; }

/* pointer-based drag reorder for itinerary legs (admin only) */
function wireLegDrag(root){
  var timeline = $('#legTimeline', root);
  if(!timeline) return;
  $all('.leg-drag', timeline).forEach(function(handle){
    handle.addEventListener('pointerdown', function(ev){
      ev.preventDefault();
      var legEls = $all('.leg', timeline);
      var fromIdx = parseInt(handle.getAttribute('data-i'),10);
      var dragEl = legEls[fromIdx];
      dragEl.classList.add('dragging');
      var startY = ev.clientY;
      var origRects = legEls.map(function(l){ return l.getBoundingClientRect(); });
      function onMove(e){
        var y = e.clientY;
        legEls.forEach(function(l){ l.classList.remove('dropline'); });
        for(var k=0;k<legEls.length;k++){
          var r = origRects[k];
          if(y < r.top + r.height/2){ legEls[k].classList.add('dropline'); break; }
        }
      }
      function onUp(e){
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        dragEl.classList.remove('dragging');
        var target = timeline.querySelector('.dropline');
        var day = STATE.itinerary[currentDayIdx];
        var toIdx = target ? parseInt(target.getAttribute('data-i'),10) : day.legs.length;
        legEls.forEach(function(l){ l.classList.remove('dropline'); });
        if(toIdx !== fromIdx && toIdx !== fromIdx+1){
          var moved = day.legs.splice(fromIdx,1)[0];
          if(toIdx > fromIdx) toIdx -= 1;
          day.legs.splice(toIdx,0,moved);
          markDirty();
        }
        renderItinerary();
      }
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  });
}

function openZoom(url){
  var root = $('#modal-root');
  root.innerHTML = '<div id="zoomModal"><button class="btn icon-only closebtn" style="background:var(--paper)">'+icon('close')+'</button><img src="'+esc(url)+'"></div>';
  var wrap = $('#zoomModal'), img = wrap.querySelector('img');
  root.querySelector('.closebtn').addEventListener('click', function(){ root.innerHTML=''; });
  wrap.addEventListener('click', function(e){ if(e.target===wrap) root.innerHTML=''; });
  var scale=1, panX=0, panY=0, lastDist=0, lastMid=null;
  function apply(){ img.style.transform = 'translate('+panX+'px,'+panY+'px) scale('+scale+')'; }
  function dist(t){ return Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY); }
  function mid(t){ return {x:(t[0].clientX+t[1].clientX)/2, y:(t[0].clientY+t[1].clientY)/2}; }
  wrap.addEventListener('touchstart', function(e){
    if(e.touches.length===2){ lastDist = dist(e.touches); lastMid = mid(e.touches); }
  }, {passive:true});
  wrap.addEventListener('touchmove', function(e){
    if(e.touches.length===2){
      e.preventDefault();
      var d = dist(e.touches), m = mid(e.touches);
      if(lastDist){ scale = Math.min(4, Math.max(1, scale * (d/lastDist))); }
      if(lastMid){ panX += m.x-lastMid.x; panY += m.y-lastMid.y; }
      lastDist=d; lastMid=m; apply();
    }
  }, {passive:false});
  wrap.addEventListener('touchend', function(e){ if(e.touches.length<2){ lastDist=0; lastMid=null; } });
  var lastTap=0;
  img.addEventListener('click', function(){
    var now = Date.now();
    if(now-lastTap < 300){ scale = scale>1?1:2.5; panX=0; panY=0; apply(); }
    lastTap = now;
  });
}

var FAV_CATS = ['全部','景點','餐廳','逛街','素食','點心'];
var FAV_AREAS = ['碼頭・北灘・中國城','舊金山市區','灣區其他','優勝美地','太浩湖'];
var FAV_FOODS = ['早午餐','海鮮','美式料理','亞洲料理','異國料理','輕食・三明治','甜點・麵包'];
var FOOD_CATS = {'餐廳':1,'素食':1,'點心':1};
function favSelect(key, label, all, values, counts){
  var cur = favFilter[key];
  var opts = '<option value="">'+label+'：全部</option>' + values.map(function(v){
    return '<option value="'+esc(v)+'"'+(v===cur?' selected':'')+'>'+esc(v)+'（'+(counts[v]||0)+'）</option>';
  }).join('');

/* which itinerary days use this favorite: confirmed (meal pick / itinerary stop) or as a meal alternative */
function enKey(t){ return (String(t||'').toLowerCase().match(/[a-z0-9'&.\-]+(?:\s+[a-z0-9'&.\-]+)*/g)||[]).map(function(x){ return x.replace(/\s+/g,' ').trim(); }).filter(function(x){ return x.length>=6; }); }
function keyHit(aKeys, text){
  var t = String(text||'').toLowerCase();
  return aKeys.some(function(k){ return t.indexOf(k)>=0; });
}
function favSchedule(f){
  var fk = enKey(f.name); if(!fk.length) return {on:[], alt:[]};
  var nameLow = String(f.name||'').toLowerCase();
  var isFood = /餐廳|素食|點心/.test(f.category||'');
  var on = [], alt = [];
  function add(arr, day, i, label){ if(!arr.some(function(x){ return x.date===day.date && x.label===label; })) arr.push({date:day.date, i:i, label:label}); }
  (STATE.itinerary||[]).forEach(function(day, i){
    if(isFood) (day.meals||[]).forEach(function(m){
      var lbl = {'早':'早餐','午':'午餐','晚':'晚餐'}[m.m] || m.m;
      if(m.pick && keyHit(fk, m.pick.map || m.pick.name)) add(on, day, i, lbl);
      (m.alts||[]).forEach(function(a){ if(keyHit(fk, a.map || a.name)) add(alt, day, i, lbl); });
    });
    (day.legs||[]).forEach(function(l){
      var hay = (l.title||'')+' '+(l.map||'');
      if(keyHit(fk, hay) || enKey(l.title).some(function(k){ return k.length>=8 && nameLow.indexOf(k)>=0; })) add(on, day, i, '行程');
    });
  });
  /* one tag per day: a meal label wins over the generic 行程; a confirmed day is never also an alternative */
  on = on.filter(function(x){ return x.label!=='行程' || !on.some(function(y){ return y.date===x.date && y.label!=='行程'; }); });
  alt = alt.filter(function(a){ return !on.some(function(o){ return o.date===a.date; }); });
  return {on:on, alt:alt};
}
function schedTagsHtml(sc){
  var h = '';
  sc.on.slice(0,3).forEach(function(x){ h += '<button type="button" class="sched-tag" data-day="'+x.i+'">✓ '+esc(x.date)+' '+esc(x.label)+'</button>'; });
  if(!sc.on.length) sc.alt.slice(0,2).forEach(function(x){ h += '<button type="button" class="sched-tag alt" data-day="'+x.i+'">備選 '+esc(x.date)+' '+esc(x.label)+'</button>'; });

}

    '<label class="field">分類<select id="fCat">'+catOpts+'</select></label>'+
    '<label class="field">區域<select id="fArea">'+optList(FAV_AREAS, f.area, '（未分區）')+'</select></label>'+
    '<label class="field">餐點種類（餐廳／素食／點心才需要）<select id="fFood">'+optList(FAV_FOODS, f.foodType, '（無）')+'</select></label>'+
    '<label class="field">備註（選填）<textarea id="fNote">'+esc(f.note||'')+'</textarea></label>'+
    '<div class="row"><button class="btn primary" id="fSave">儲存</button></div>',
    function(root){
      root.querySelector('#fSave').addEventListener('click', function(){
        var name = root.querySelector('#fName').value.trim();
        if(!name){ toast('請輸入地點名稱'); return; }
        var obj = { name:name, mapUrl: root.querySelector('#fUrl').value.trim(), category: root.querySelector('#fCat').value,
          area: root.querySelector('#fArea').value.trim(), foodType: root.querySelector('#fFood').value.trim(),
          note: root.querySelector('#fNote').value.trim() };
        if(isNew) favs.push(obj); else favs[i]=obj;
        markDirty(); closeModal(); renderFavorites();
      });
    });
}

/* ============ PACKING ============ */
function renderPacking(){
  var el = $('#tab-packing');
  var pills = STATE.meta.members.map(function(m){ return '<div class="memberpill" data-m="'+esc(m)+'" aria-selected="'+(m===currentMember)+'">'+esc(m)+'</div>'; }).join('');
  function section(title, key){
    var items = STATE.packing[key];
    var rows = items.map(function(it){
      var ck = lsGet('pack:'+currentMember+':'+it.id, false);
      return '<div class="checkrow'+(ck?' done':'')+'"><input type="checkbox" data-id="'+it.id+'" data-key="'+key+'"'+(ck?' checked':'')+'><span class="txt">'+esc(it.text)+'</span>'+
        (isAdmin?('<button class="btn sm icon-only pk-del" data-key="'+key+'" data-id="'+it.id+'">'+icon('trash')+'</button>'):'')+'</div>';
    }).join('');
    var addRow = isAdmin ? ('<button class="btn ghost sm pk-add" data-key="'+key+'" style="margin-top:8px">'+icon('plus')+' 新增項目</button>') : '';
    return '<div class="card"><div class="section-title">'+title+'</div>'+(rows||'<div class="muted">尚無項目</div>')+addRow+'</div>';
  }
  el.innerHTML = '<div class="section-title">'+icon('bag')+'行李打包</div>'+
    '<div class="muted" style="margin-bottom:8px">選自己的名字後勾選，勾選只存在你自己的手機上</div>'+
    '<div id="memberpills">'+pills+'</div>'+
    section('隨身行李','carryOn')+section('行李箱','checked');

  $all('.memberpill', el).forEach(function(p){ p.addEventListener('click', function(){ currentMember = p.getAttribute('data-m'); renderPacking(); }); });
  $all('input[type=checkbox]', el).forEach(function(cb){
    cb.addEventListener('change', function(){
      lsSet('pack:'+currentMember+':'+cb.getAttribute('data-id'), cb.checked);
      cb.closest('.checkrow').classList.toggle('done', cb.checked);
    });
  });
  $all('.pk-del', el).forEach(function(b){ b.addEventListener('click', function(){
    var key = b.getAttribute('data-key'), id = b.getAttribute('data-id');
    STATE.packing[key] = STATE.packing[key].filter(function(it){ return it.id!==id; });
    markDirty(); renderPacking();
  }); });
  $all('.pk-add', el).forEach(function(b){ b.addEventListener('click', function(){
    var key = b.getAttribute('data-key');
    openModal('新增打包項目', '<label class="field">項目內容<input type="text" id="fTxt"></label><div class="row"><button class="btn primary" id="fSave">新增</button></div>', function(root){
      root.querySelector('#fSave').addEventListener('click', function(){
        var txt = root.querySelector('#fTxt').value.trim();
        if(!txt){ toast('請輸入內容'); return; }
        STATE.packing[key].push({id: uid('p'), text: txt});
        markDirty(); closeModal(); renderPacking();
      });
    });
  }); });
}

/* ============ BUDGET ============ */
/* ============ BUDGET ============
   Claude version: admin-only, entries live in STATE.budget.entries.
   GitHub version with a shared ledger: entries live in the owner's Google Sheet
   (Apps Script web app), and everyone who opens the page can add / edit / delete. */
var ledger = {rows: null, loading: false, error: '', at: null};
function ledgerOn(){ return HOST === 'github' && !!(STATE.budget && STATE.budget.sheetUrl); }
function ledgerCache(){ var c = lsGet('ledger', null); if(c && c.url === STATE.budget.sheetUrl){ ledger.rows = c.rows; ledger.at = c.at; } }
function ledgerStore(rows){
  ledger.rows = rows; ledger.at = Date.now(); ledger.error = '';
  lsSet('ledger', {url: STATE.budget.sheetUrl, rows: rows, at: ledger.at});
}
function ledgerLoad(){
  if(!ledgerOn() || ledger.loading) return;
  ledger.loading = true; if(currentTab==='budget') renderBudget();
  fetch(STATE.budget.sheetUrl + (STATE.budget.sheetUrl.indexOf('?')<0?'?':'&') + 'key=' + encodeURIComponent(STATE.budget.sheetKey||''))
    .then(function(r){ return r.json(); })
    .then(function(d){ if(!d.ok) throw new Error(d.error||'error'); ledgerStore(d.rows||[]); })
    .catch(function(){ ledger.error = '讀不到共用帳本，請檢查網路後按「重新整理」'; })
    .then(function(){ ledger.loading = false; if(currentTab==='budget') renderBudget(); });
}
function ledgerSend(action, row){
  toast(action==='delete' ? '刪除中…' : '儲存中…');
  return fetch(STATE.budget.sheetUrl, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({key: STATE.budget.sheetKey||'', action: action, row: row})})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d.ok) throw new Error(d.error||'error');
      ledgerStore(d.rows||[]); renderBudget(); toast(action==='delete' ? '已刪除' : '已儲存');
    })
    .catch(function(err){ toast(err && err.message==='not found' ? '這筆可能已被別人刪除，已重新載入' : '儲存失敗，請檢查網路後再試一次'); ledgerLoad(); throw new Error('send'); });
}
function fmtTime(t){ if(!t) return ''; var d = new Date(t); return (d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function renderBudget(){
  var el = $('#tab-budget');
  var shared = ledgerOn();
  if(shared && ledger.rows===null){ ledgerCache(); }
  var entries = shared ? (ledger.rows||[]) : (STATE.budget.entries||[]);
  var canEdit = shared || isAdmin;
  var rate = STATE.budget.exchangeRate||31.5;
  var totalTwd = 0, byCat = {}, byPayer = {};
  entries.forEach(function(e){
    var twd = e.currency==='USD' ? e.amount*rate : e.amount;
    totalTwd += twd;
    byCat[e.category] = (byCat[e.category]||0) + twd;
    byPayer[e.payer] = (byPayer[e.payer]||0) + twd;
  });
  var catHtml = Object.keys(byCat).map(function(c){ return '<div class="expense-row"><span>'+esc(c)+'</span><span class="expense-amt">NT$ '+fmtTWD(byCat[c])+'</span></div>'; }).join('');
  var payerHtml = Object.keys(byPayer).map(function(p){ return '<div class="expense-row"><span>'+esc(p)+'</span><span class="expense-amt">NT$ '+fmtTWD(byPayer[p])+'</span></div>'; }).join('');
  var order = entries.map(function(e, i){ return {e:e, i:i}; }).sort(function(a, b){ return String(b.e.date).localeCompare(String(a.e.date)) || b.i - a.i; });
  var listHtml = order.map(function(x){
    var e = x.e, twd = e.currency==='USD' ? e.amount*rate : e.amount;
    return '<div class="expense-row"><div><div>'+esc(e.item)+'</div><div class="meta">'+esc(e.date)+'　'+esc(e.category)+'　'+esc(e.payer)+' 付款'+(e.note?('　'+esc(e.note)):'')+'</div></div>'+
      '<div style="text-align:right">'+(e.currency==='USD'?('<div class="muted" style="font-size:14px">US$ '+Number(e.amount).toFixed(2)+'</div>'):'')+
      '<div class="expense-amt">NT$ '+fmtTWD(twd)+'</div>'+
      (canEdit?('<button class="btn sm icon-only exp-edit" data-i="'+x.i+'" style="margin-top:4px" aria-label="修改">'+icon('edit')+'</button>'):'')+'</div></div>';
  }).join('');
  var rateRow = isAdmin ? ('<label class="field">匯率（1 美金＝多少台幣，只有管理員能改）<input type="number" step="0.01" id="fRate" value="'+rate+'"></label>') :
    ('<div class="muted" style="margin-bottom:10px">匯率：1 美金 = '+rate+' 台幣</div>');
  var status = shared ? ('<div class="fav-count" style="margin:4px 0 10px"><span>'+
      (ledger.loading ? '讀取共用帳本中…' : ledger.error ? esc(ledger.error) : ('大家共用的帳本・'+fmtTime(ledger.at)+' 更新'))+
      '</span><button class="linkbtn" id="ledgerRefresh">重新整理</button></div>') : '';
  var addBtn = canEdit ? '<button class="btn primary" id="btnAddExp" style="width:100%;margin:10px 0">'+icon('plus')+' 新增一筆花費</button>' : '';
  var setup = (HOST==='github' && isAdmin) ? '<button class="btn ghost sm" id="btnLedgerSetup" style="margin-bottom:10px">'+icon('link')+(shared?' 共用帳本設定':' 設定共用帳本（讓大家都能記帳）')+'</button>' : '';

  el.innerHTML = '<div class="section-title">'+icon('wallet')+'目前花費</div>'+ setup + status +
    '<div class="card"><div class="stat-grid"><div class="stat-tile"><b>NT$ '+fmtTWD(totalTwd)+'</b><span>總花費</span></div>'+
    '<div class="stat-tile"><b>'+entries.length+'</b><span>筆記錄</span></div></div>'+rateRow+'</div>'+
    addBtn+
    (Object.keys(byCat).length?('<div class="card"><div class="section-title" style="font-size:16.5px">依類別</div>'+catHtml+'</div>'):'')+
    (Object.keys(byPayer).length?('<div class="card"><div class="section-title" style="font-size:16.5px">依付款人</div>'+payerHtml+'</div>'):'')+
    (listHtml ? '<div class="card">'+listHtml+'</div>' : (shared && ledger.loading ? '' : '<div class="empty-state">'+icon('wallet')+'<div>還沒有花費記錄</div></div>'));

  var rateInput = $('#fRate', el);
  if(rateInput) rateInput.addEventListener('change', function(){
    var v = parseFloat(rateInput.value); if(v>0){ STATE.budget.exchangeRate = v; markDirty(); renderBudget(); }
  });
  var addExpBtn = $('#btnAddExp', el);
  if(addExpBtn) addExpBtn.addEventListener('click', function(){ openExpenseEditor(-1); });
  $all('.exp-edit', el).forEach(function(b){ b.addEventListener('click', function(){ openExpenseEditor(parseInt(b.getAttribute('data-i'),10)); }); });
  var rf = $('#ledgerRefresh', el); if(rf) rf.addEventListener('click', ledgerLoad);
  var st = $('#btnLedgerSetup', el); if(st) st.addEventListener('click', openLedgerSetup);
  if(shared && !ledger.loading && (ledger.at===null || Date.now()-ledger.at > 60000) && !ledger.error) ledgerLoad();
}
function openExpenseEditor(i){
  var shared = ledgerOn();
  var list = shared ? (ledger.rows||[]) : STATE.budget.entries;
  var isNew = i < 0;
  var e = isNew ? {date:(function(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); })(new Date()), category:'餐飲', item:'', amount:'', currency:'USD', payer:STATE.meta.members[0], note:''} : list[i];
  var cats = ['交通','住宿','餐飲','門票','購物','其他'];
  openModal(isNew?'新增花費':'修改花費',
    '<label class="field">日期<input type="date" id="fDate" value="'+esc(e.date)+'"></label>'+
    '<label class="field">類別<select id="fCat">'+cats.map(function(c){ return '<option'+(c===e.category?' selected':'')+'>'+c+'</option>'; }).join('')+'</select></label>'+
    '<label class="field">項目<input type="text" id="fItem" value="'+esc(e.item)+'"></label>'+
    '<div class="row"><label class="field" style="flex:1">金額<input type="number" step="0.01" inputmode="decimal" id="fAmt" value="'+esc(e.amount)+'"></label>'+
    '<label class="field" style="flex:0 0 100px">幣別<select id="fCur"><option value="USD"'+(e.currency==='USD'?' selected':'')+'>美金</option><option value="TWD"'+(e.currency==='TWD'?' selected':'')+'>台幣</option></select></label></div>'+
    '<label class="field">付款人<select id="fPayer">'+STATE.meta.members.map(function(m){ return '<option'+(m===e.payer?' selected':'')+'>'+esc(m)+'</option>'; }).join('')+'</select></label>'+
    '<label class="field">備註（選填）<input type="text" id="fENote" value="'+esc(e.note||'')+'"></label>'+
    '<div class="row"><button class="btn primary" id="fSave">'+(isNew?'新增':'儲存')+'</button>'+
    (isNew?'':'<button class="btn warn" id="fDel">刪除這筆</button>')+'</div>',
    function(root){
      var busy = false;
      root.querySelector('#fSave').addEventListener('click', function(){
        if(busy) return;
        var amt = parseFloat(root.querySelector('#fAmt').value);
        var item = root.querySelector('#fItem').value.trim();
        if(!item || !(amt>0)){ toast('請輸入項目與金額'); return; }
        var row = {id: e.id || uid('exp'), date: root.querySelector('#fDate').value, category: root.querySelector('#fCat').value,
          item: item, amount: amt, currency: root.querySelector('#fCur').value, payer: root.querySelector('#fPayer').value,
          note: root.querySelector('#fENote').value.trim()};
        if(shared){
          busy = true;
          ledgerSend(isNew?'add':'update', row).then(function(){ closeModal(); }, function(){ busy = false; });
        } else {
          if(isNew) list.push(row); else list[i] = row;
          markDirty(); closeModal(); renderBudget();
        }
      });
      var del = root.querySelector('#fDel'), armed = false;
      if(del) del.addEventListener('click', function(){
        if(busy) return;
        if(!armed){ armed = true; del.textContent = '再按一次確認刪除'; return; }
        if(shared){ busy = true; ledgerSend('delete', {id: e.id}).then(function(){ closeModal(); }, function(){ busy = false; }); }
        else { list.splice(i,1); markDirty(); closeModal(); renderBudget(); }
      });
    });
}
function openLedgerSetup(){
  var b = STATE.budget;
  openModal('共用帳本設定',
    '<p class="muted" style="margin-bottom:10px">貼上 Google Apps Script 部署後的網頁應用程式網址（/exec 結尾）。存好後按「發布」，大家就能一起記帳。</p>'+
    '<label class="field">網頁應用程式網址<input type="text" id="lgUrl" value="'+esc(b.sheetUrl||'')+'" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off"></label>'+
    '<label class="field">密鑰（要跟 Code.gs 裡的 KEY 一樣）<input type="text" id="lgKey" value="'+esc(b.sheetKey||'LnraXHAWqVrpDxHW')+'" autocapitalize="off"></label>'+
    '<div class="row"><button class="btn primary" id="lgSave">測試並儲存</button>'+(b.sheetUrl?'<button class="btn ghost" id="lgOff">停用共用帳本</button>':'')+'</div>',
    function(root){
      root.querySelector('#lgSave').addEventListener('click', function(){
        var url = root.querySelector('#lgUrl').value.trim(), key = root.querySelector('#lgKey').value.trim();
        if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){ toast('請貼上 https://script.google.com/… 開頭的網址'); return; }
        toast('連線測試中…');
        fetch(url + (url.indexOf('?')<0?'?':'&') + 'key=' + encodeURIComponent(key)).then(function(r){ return r.json(); }).then(function(d){
          if(!d.ok) throw new Error(d.error);
          b.sheetUrl = url; b.sheetKey = key; ledger = {rows:null, loading:false, error:'', at:null}; ledgerStore(d.rows||[]);
          markDirty(); closeModal(); renderBudget(); toast('連線成功！記得按「發布更新」讓大家也能用');
        }).catch(function(){ toast('連不上：請確認網址、密鑰，以及部署時「誰可以存取」選了「所有人」'); });
      });
      var off = root.querySelector('#lgOff');
      if(off) off.addEventListener('click', function(){ b.sheetUrl = ''; markDirty(); closeModal(); renderBudget(); });
    });
}

/* ============ TODOS ============ */
function renderTodos(){
  var el = $('#tab-todos');
  var todos = STATE.todos||[];
  var rows = todos.map(function(t,i){
    return '<div class="todo-row'+(t.done?' done':'')+'"><div class="dot" data-i="'+i+'">'+(t.done?icon('check'):'')+'</div>'+
      '<span class="txt" style="flex:1">'+esc(t.text)+'</span>'+
      (isAdmin?('<button class="btn sm icon-only todo-del" data-i="'+i+'">'+icon('trash')+'</button>'):'')+'</div>';
  }).join('');
  var addBtn = isAdmin ? '<button class="btn primary" id="btnAddTodo" style="width:100%;margin-top:10px">'+icon('plus')+' 新增待辦事項</button>' : '';
  el.innerHTML = '<div class="section-title">'+icon('check-sq')+'出發前待辦</div>'+
    (rows ? '<div class="card">'+rows+'</div>' : '<div class="empty-state">'+icon('check-sq')+'<div>還沒有待辦事項</div></div>')+addBtn;
  $all('.dot', el).forEach(function(d){ d.addEventListener('click', function(){
    if(!isAdmin){ return; }
    var i = parseInt(d.getAttribute('data-i'),10); todos[i].done = !todos[i].done; markDirty(); renderTodos();
  }); });
  $all('.todo-del', el).forEach(function(b){ b.addEventListener('click', function(){ todos.splice(parseInt(b.getAttribute('data-i'),10),1); markDirty(); renderTodos(); }); });
  var addTodoBtn = $('#btnAddTodo', el);
  if(addTodoBtn) addTodoBtn.addEventListener('click', function(){
    openModal('新增待辦事項', '<label class="field">內容<input type="text" id="fTxt"></label><div class="row"><button class="btn primary" id="fSave">新增</button></div>', function(root){
      root.querySelector('#fSave').addEventListener('click', function(){
        var txt = root.querySelector('#fTxt').value.trim();
        if(!txt){ toast('請輸入內容'); return; }
        todos.push({id: uid('t'), text: txt, done:false});
        markDirty(); closeModal(); renderTodos();
      });
    });
  });
}

/* ============ render all / boot ============ */
function renderAll(){
  renderTabbar(); syncNavHeight();
  renderCurrentTab();
  renderAdminBar();
}
function wireGlobal(){
  $('#adminfab').addEventListener('click', openAdminModal);
}
function lineBanner(){
  if(!/\bLine\//i.test(navigator.userAgent) || document.getElementById('linebanner')) return;
  var b = document.createElement('div'); b.id = 'linebanner';
  b.innerHTML = icon('warn')+'<span>你正在 LINE 內建瀏覽器開啟，打包勾選可能存不起來。請點右上角「⋯」選「用預設瀏覽器開啟」，改用 Safari 或 Chrome。</span>';
  document.body.insertBefore(b, document.body.firstChild);
}
function boot(hotData){
  lineBanner();
  isAdmin = !!lsGet('adminUnlocked', false) && (HOST !== 'github' || !!ghRepo().token);
  var lastTab = lsGet('lastTab', null);
  if(lastTab && TABS.some(function(t){return t.id===lastTab;})) currentTab = lastTab;
  wireGlobal();
  renderAll();
  if(HOST === 'github'){ ghSyncLatest(); } else { initCaps().then(function(){ renderAll(); }); }
}
if(window.claude && window.claude.hot && window.claude.hot.ready){
  window.claude.hot.ready(boot);
} else {
  boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
}
})();
</script>
